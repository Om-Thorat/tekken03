# Tekken 3 Web Edition runtime settings

[video]
renderer          = "opengl"
supersampling     = 1
window_width      = 1280
antialiasing      = true
texture_filtering = "nearest"
geometry_correction   = false
perspective_texturing = true
crt_filter        = "raw"
fast_boot         = false
bios_hle          = true
fullscreen        = 0
frame_interpolation = false
frame_interpolation_fps = 0
aspect_ratio      = "4:3"

[audio]
spu_hq = false

[launcher]
skip_launcher = true

[memcard]
dir     = "saves"
card1   = "saves/card1.mcd"
card2   = "saves/card2.mcd"
enable1 = true
enable2 = true

[controller]
p1_device = "keyboard"
p1_mode   = "digital"
p1_deadzone = 3276
p2_device = "keyboard"
p2_mode   = "digital"
p2_deadzone = 3276
multitap  = true
multitap_analog = true
deadzone  = 3276

[localization]
language = "en"
