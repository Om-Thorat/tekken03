triangle  = Keypad 5
circle    = Keypad 2
cross     = Keypad 1
square    = Keypad 4
l1        = U
l2        = Keypad 7
r1        = O
r2        = Keypad 9
l3        = Keypad 0
r3        = Keypad .
start     = Keypad Enter
select    = Backspace
ls_up     = I
ls_down   = K
ls_left   = J
ls_right  = L
rs_up     = None
rs_down   = None
rs_left   = None
rs_right  = None

